<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 English - Comparison of Adjectives Interactive</title>
    <style>
        :root {
            --primary: #4A6FA5;
            --primary-dark: #3B5984;
            --secondary: #47B39D;
            --accent: #FF7B54;
            --bg-light: #F6F8FA;
            --text-main: #2D3748;
            --text-muted: #718096;
            --white: #FFFFFF;
            --correct-bg: #E6F4EA;
            --correct-text: #137333;
            --wrong-bg: #FCE8E6;
            --wrong-text: #C5221F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 12px;
        }

        /* Splash Screen Layout */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-logo-container {
            width: 280px;
            max-width: 85%;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .splash-logo-container img,
        .header-logo-container img {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .loader-bar {
            width: 150px;
            height: 6px;
            background-color: #E2E8F0;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 100%;
            height: 100%;
            background-color: var(--primary);
            position: absolute;
            left: -100%;
            animation: load 3s linear forwards;
        }

        @keyframes load {
            to { left: 0; }
        }

        /* App Container Layout */
        .app-container {
            width: 100%;
            max-width: 720px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin: 16px auto;
            display: none;
            position: relative;
        }

        /* Header UI Component */
        .interactive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #EDF2F7;
            padding-bottom: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-container {
            width: 160px;
            height: auto;
        }

        .chapter-title {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 700;
        }

        .tracker-badge {
            background-color: #EBF8FF;
            color: #2B6CB0;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Progress System Component */
        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .progress-track {
            flex-grow: 1;
            height: 8px;
            background-color: #E2E8F0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        .timer-box {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            background-color: #FFF5F5;
            color: #C53030;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 45px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid #FED7D7;
        }

        /* Passage Context Block Component */
        .card-context {
            background-color: #F7FAFC;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 4px 8px 8px 4px;
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Options Stack Component */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: var(--white);
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #F8FAFC;
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.selected-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--secondary) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.selected-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--accent) !important;
            color: var(--wrong-text) !important;
        }

        /* Feedback Banner Component */
        .feedback-banner {
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-footer {
            display: flex;
            justify-content: flex-end;
        }

        .action-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-dark);
        }

        .action-btn:disabled {
            background-color: #CBD5E0;
            cursor: not-allowed;
        }

        /* Evaluation View Component */
        .results-container {
            text-align: center;
            display: none;
            padding: 20px 10px;
        }

        .results-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 15px 0;
        }

        .results-msg {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Panel -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <img src="assets/logo.png" alt="Innovine Solutions Logo" onerror="this.onerror=null; this.src='g3/ch9/assets/logo.png';">
        </div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Main Challenge Dashboard Container -->
    <div class="app-container" id="challenge-board">
        <div class="interactive-header">
            <div class="header-brand">
                <div class="header-logo-container">
                    <img src="assets/logo.png" alt="Innovine Solutions Logo" onerror="this.onerror=null; this.src='g3/ch9/assets/logo.png';">
                </div>
                <span class="chapter-title">Chapter 9: Comparison of Adjectives</span>
            </div>
            <span class="tracker-badge" id="score-display">Score: 0</span>
        </div>
